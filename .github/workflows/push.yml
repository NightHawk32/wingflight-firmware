name: Push-CI

on:
  push:
    branches:
      - 'master'
      - 'RF-*'

env:

  TARGETS: unified MATEKF405 MATEKF411 MATEKF722 MATEKH743
  RP2350_TARGETS: RP2350A RP2350B RP2354A RP2354B

jobs:

  ci-build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM tools
      run: make arm_sdk_install

    - name: Set build variables
      run: |
        echo "GIT_VER=CI-${GITHUB_SHA:0:7}" >> ${GITHUB_ENV}
        cat ${GITHUB_ENV}

    - name: Build HEX files for multiple targets
      run: make ${{ env.TARGETS }} FC_VER_SUFFIX="${{ env.GIT_VER }}" FLASH_CONFIG_ERASE=yes

    # Each RP2350/RP2354 variant produces a UF2 (the family's default make
    # goal); no separate per-target uf2 invocation needed.
    - name: Build UF2 files for RP2350/RP2354 targets
      run: make ${{ env.RP2350_TARGETS }} FC_VER_SUFFIX="${{ env.GIT_VER }}" FLASH_CONFIG_ERASE=yes

    - name: Move HEX/UF2
      run: mv -v obj/*STM32*.hex obj/*.uf2 .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wingflight-${{ env.GIT_VER }}
        path: |
          wingflight*.hex
          wingflight*.uf2

